<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LÍDER LEONES</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
h1{color:gold;font-size:35px}
button{background:gold;color:#000;border:0;padding:20px 40px;font-size:22px;border-radius:15px;font-weight:bold;margin-top:20px}

<body>
<h1>🦁 LÍDER LEONES 🦁</h1>
<div class="card">
<h2>¡Bienvenido Wawqey!</h2>
<p>Tu App ya funciona</p>
<p id="c">Leones: 0</p>
<button onclick="rugir()">¡RUGIR! 🦁</button>
</div>

let n=0
function rugir(){n++;document.getElementById('c').innerText='Leones: '+n}
</script>
</body>
